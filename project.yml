# Fallback project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
#
# QuranRemote.xcodeproj is checked in and is the source of truth — you do not
# need this file. It is here so the project can be regenerated from scratch
# (`brew install xcodegen && xcodegen generate`) if the checked-in project ever
# gets into a bad state after a merge.

name: QuranRemote
options:
  bundleIdPrefix: com.quranremote
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  QuranCore:
    path: Packages/QuranCore

targets:
  QuranRemote:
    type: application
    platform: iOS
    sources:
      - path: QuranRemote
    dependencies:
      - package: QuranCore
        product: QuranCore
      - package: QuranCore
        product: QuranLink
      - target: QuranRemote Watch App
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Config/QuranRemote-Info.plist
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.quranremote.app
        TARGETED_DEVICE_FAMILY: "1,2"

  QuranRemote Watch App:
    type: application
    platform: watchOS
    sources:
      - path: QuranRemote Watch App
    dependencies:
      - package: QuranCore
        product: QuranCore
      - package: QuranCore
        product: QuranLink
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Config/QuranRemoteWatch-Info.plist
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.quranremote.app.watchkitapp
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  QuranRemote:
    build:
      targets:
        QuranRemote: all
    run:
      config: Debug
    archive:
      config: Release
  QuranRemote Watch App:
    build:
      targets:
        QuranRemote Watch App: all
    run:
      config: Debug
